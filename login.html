<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход — Echo</title>
  <link rel="stylesheet" href="css/style.min.css">
  <script src="js/app.min.js" defer></script>
</head>

<body>
  <main class="auth-layout">
    <aside class="auth-aside">
      <a class="brand brand-small" href="index.html">
        <span class="brand-name">echo</span>
        <span class="brand-subtitle">ТВОЙ ЛИЧНЫЙ ДНЕВНИК</span>
      </a>
      <img class="aside-art" src="assets/echo-illustration.png" alt="">
      <p class="quote">«Иногда, чтобы услышать себя, нужно просто записать.»</p>
    </aside>

    <section class="auth-content">
      <a class="back-link" href="index.html">← На главную</a>
      <h1>Вход</h1>
      <p class="intro">Добро пожаловать обратно, где твои мысли важны.</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span>✉</span>
          <input type="email" id="loginEmail" placeholder="E-mail" required>
        </label>

        <label class="field">

          <input type="password" id="loginPassword" placeholder="Пароль" required>
          <button class="toggle-password" type="button" data-target="loginPassword">◉</button>
        </label>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            Запомнить меня
          </label>
          <a href="#forgot" id="forgotLink">Забыли пароль?</a>
        </div>

        <p class="form-message" id="loginMessage"></p>
        <button class="button button-primary submit-button" type="submit">Войти</button>
      </form>

      <p class="switch-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </section>
  </main>
</body>

</html>
